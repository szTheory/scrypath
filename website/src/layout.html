<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f15" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}{{PAGE_PATH}}" />
    <meta property="og:image" content="{{SITE_URL}}assets/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{PAGE_TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{SITE_URL}}{{PAGE_PATH}}" />
    <link rel="icon" href="{{BASE_PATH}}assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{BASE_PATH}}assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{BASE_PATH}}index.html" aria-label="Scrypath home">
          <img src="{{BASE_PATH}}assets/brand-mark.svg" alt="" aria-hidden="true" width="34" height="34" />
          <span>
            <strong>Scrypath</strong>
            <small>Ecto-native search indexing</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{BASE_PATH}}index.html">Home</a>
          <a href="{{BASE_PATH}}docs/">Docs</a>
          <a href="{{BASE_PATH}}operators/">Operations</a>
          <a href="{{BASE_PATH}}evaluate/">Evaluate</a>
        </nav>

        <div class="header-actions">
          <a class="github-star" href="{{REPO_URL}}" aria-label="Star Scrypath on GitHub">
            <svg class="github-star-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 2.8 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5-4.7-4.6 6.5-.9L12 2.8Z" />
            </svg>
            <span>Star</span>
          </a>
          <a class="version-pill" href="https://hex.pm/packages/scrypath" rel="noreferrer">v{{VERSION}}</a>
        </div>
      </header>

      <main id="content">
        {{CONTENT}}
      </main>

      <footer class="site-footer">
        <p>
          Scrypath is Apache-2.0 open source for Phoenix and Ecto teams.
        </p>
        <p class="footer-links">
          <a href="https://hex.pm/packages/scrypath" rel="noreferrer">Hex package</a>
          <a href="https://hexdocs.pm/scrypath" rel="noreferrer">HexDocs</a>
          <a href="{{REPO_URL}}">GitHub</a>
        </p>
      </footer>
    </div>
  </body>
</html>
