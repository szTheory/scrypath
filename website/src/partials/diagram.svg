<svg class="diagram" viewBox="0 0 1200 620" aria-hidden="true">
  <rect class="dg-bg" x="1" y="1" width="1198" height="618" rx="15" />
  <text class="dg-title" x="36" y="60" font-size="34">Record to index</text>
  <text class="dg-sub" x="36" y="98" font-size="20">Declare schema metadata, sync through your context, and recover drift when it appears.</text>
  <rect class="dg-chip" x="898" y="26" width="266" height="52" rx="12" />
  <text class="dg-chip-text" x="1031" y="59" font-size="20" text-anchor="middle">Check sync status</text>

  <path class="dg-path" d="M88 290C176 228 262 228 350 290C438 352 524 352 612 290C700 228 786 228 874 290C962 352 1048 352 1136 290" />
  <circle class="dg-dot-a" cx="88" cy="290" r="9" />
  <circle class="dg-dot-b" cx="350" cy="290" r="9" />
  <circle class="dg-dot-c" cx="612" cy="290" r="9" />
  <circle class="dg-dot-d" cx="874" cy="290" r="9" />
  <circle class="dg-dot-e" cx="1136" cy="290" r="9" />

  <g class="dg-nodes">
    <rect class="dg-node" x="24" y="330" width="168" height="108" rx="14" />
    <text class="dg-node-title" x="108" y="366" font-size="24" text-anchor="middle">Schema</text>
    <text class="dg-sub" x="108" y="392" font-size="16" text-anchor="middle">use Scrypath</text>
    <text class="dg-muted" x="108" y="414" font-size="14" text-anchor="middle">metadata only</text>

    <rect class="dg-node" x="286" y="330" width="168" height="108" rx="14" />
    <text class="dg-node-title" x="370" y="366" font-size="24" text-anchor="middle">Context</text>
    <text class="dg-sub" x="370" y="392" font-size="16" text-anchor="middle">explicit orchestration</text>
    <text class="dg-muted" x="370" y="414" font-size="14" text-anchor="middle">search + sync boundary</text>

    <rect class="dg-node" x="548" y="330" width="168" height="108" rx="14" />
    <text class="dg-node-title" x="632" y="366" font-size="24" text-anchor="middle">Scrypath</text>
    <text class="dg-sub" x="632" y="392" font-size="16" text-anchor="middle">sync + recovery</text>
    <text class="dg-muted" x="632" y="414" font-size="14" text-anchor="middle">accepted work</text>

    <rect class="dg-node" x="810" y="330" width="186" height="108" rx="14" />
    <text class="dg-node-title" x="903" y="366" font-size="24" text-anchor="middle">Meilisearch</text>
    <text class="dg-sub" x="903" y="392" font-size="16" text-anchor="middle">index / tasks / stats</text>
    <text class="dg-muted" x="903" y="414" font-size="14" text-anchor="middle">backend state</text>

    <rect class="dg-node" x="1050" y="330" width="126" height="108" rx="14" />
    <text class="dg-node-title" x="1113" y="366" font-size="22" text-anchor="middle">Result</text>
    <text class="dg-sub" x="1113" y="392" font-size="16" text-anchor="middle">records</text>
    <text class="dg-muted" x="1113" y="414" font-size="14" text-anchor="middle">plus hits</text>
  </g>

  <g class="dg-command">
    <rect class="dg-cmd-bg" x="38" y="478" width="1124" height="96" rx="14" />
    <text class="dg-cmd" x="62" y="513" font-size="20">mix scrypath.status MyApp.Post</text>
    <text class="dg-sub" x="62" y="540" font-size="18">Accepted work is not the same thing as search visibility.</text>
  </g>
</svg>
