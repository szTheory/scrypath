services:
  web:
    ports: !reset []
    command: ["sh", "./docker-e2e-entrypoint.sh"]
    environment:
      SCRYPATH_OPS_PLAYBOOK_DIR: /app/examples/scrypath_ecommerce/priv/playbooks
    volumes:
      - phase174_playbooks:/app/examples/scrypath_ecommerce/priv/playbooks
      - phase174_web_build:/app/examples/scrypath_ecommerce/_build
      - phase174_web_ops_build:/app/scrypath_ops/_build
    init: true

  ops:
    build:
      context: ../..
      dockerfile: examples/scrypath_ecommerce/Dockerfile
    command: ["sh", "./scripts/phase174-standalone-entrypoint.sh"]
    environment:
      MIX_ENV: test
      PHX_SERVER: "true"
      PORT: "4003"
      SCRYPATH_OPS_PORT: "4003"
      SCRYPATH_OPS_TEST_HOST: "ops"
      SCRYPATH_OPS_SCHEMAS: "ScrypathOps.Test.OpsPostA,ScrypathOps.Test.OpsPostB"
      PGHOST: postgres
      PGPORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - phase174_ops_build:/app/scrypath_ops/_build
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:4003/ops/phase174/health"]
      interval: 2s
      timeout: 5s
      start_period: 5m
      retries: 60
    init: true

  browser:
    build:
      context: ../..
      dockerfile: examples/scrypath_ecommerce/Dockerfile.e2e
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.60.0}
    environment:
      CI: "1"
      E2E_SCOPE: ${E2E_SCOPE:-phase174-recovery}
      PLAYWRIGHT_BASE_URL: http://web:4002
      PHASE174_OPS_BASE_URL: http://ops:4003/ops/phase174
      SCRYPATH_SOURCE_SHA: ${SCRYPATH_SOURCE_SHA:-unknown}
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/${E2E_SCOPE:-phase174-recovery}.xml
    depends_on:
      web:
        condition: service_healthy
      ops:
        condition: service_healthy
    volumes:
      - phase174_playbooks:/app/examples/scrypath_ecommerce/priv/playbooks
    init: true
    ipc: host

volumes:
  phase174_playbooks:
  phase174_web_build:
  phase174_web_ops_build:
  phase174_ops_build:
