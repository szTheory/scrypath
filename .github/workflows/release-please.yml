name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned patch; upstream action.yml still uses `node20` until Google ships a
      # node24 runner—watch releases: https://github.com/googleapis/release-please-action
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-hex:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - name: Install Hex
        run: mix local.hex --force

      - name: Install Rebar
        run: mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Verify workspace is clean
        run: mix verify.workspace_clean

      - name: Verify release version
        run: grep -n "@version \"${{ needs.release-please.outputs.version }}\"" mix.exs

      - name: Run release contract gate
        run: mix verify.package

      - name: Dry run Hex publish
        run: mix hex.publish --dry-run --yes

      - name: Publish package to Hex
        run: mix hex.publish --yes

      - name: Verify the live published release
        env:
          SCRYPATH_RELEASE_VERIFY_ATTEMPTS: "20"
          SCRYPATH_RELEASE_VERIFY_SLEEP_MS: "15000"
        run: mix verify.release_publish "${{ needs.release-please.outputs.version }}"

      - name: Verify release parity (tarball vs tag)
        env:
          SCRYPATH_RELEASE_VERIFY_ATTEMPTS: "20"
          SCRYPATH_RELEASE_VERIFY_SLEEP_MS: "15000"
        run: mix verify.release_parity "${{ needs.release-please.outputs.version }}"
