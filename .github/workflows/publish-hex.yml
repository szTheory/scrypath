name: Publish Hex Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Reviewed git tag or commit ref to publish from."
        required: true
        type: string
      release_version:
        description: "Expected Scrypath version at that ref."
        required: true
        type: string

jobs:
  publish-scrypath:
    name: Publish scrypath recovery
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - name: Install Hex
        run: mix local.hex --force

      - name: Install Rebar
        run: mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Verify workspace is clean
        run: mix verify.workspace_clean

      - name: Verify release version
        run: grep -n "@version \"${{ inputs.release_version }}\"" mix.exs

      - name: Run release contract gate
        run: mix verify.phase11

      - name: Dry run Hex publish
        run: mix hex.publish --dry-run --yes

      - name: Publish package to Hex
        run: mix hex.publish --yes

      - name: Verify the live published release
        env:
          SCRYPATH_RELEASE_VERIFY_ATTEMPTS: "20"
          SCRYPATH_RELEASE_VERIFY_SLEEP_MS: "15000"
        run: mix verify.release_publish "${{ inputs.release_version }}"

      - name: Verify release parity (tarball vs tag)
        env:
          SCRYPATH_RELEASE_VERIFY_ATTEMPTS: "20"
          SCRYPATH_RELEASE_VERIFY_SLEEP_MS: "15000"
        run: mix verify.release_parity "${{ inputs.release_version }}"
