name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'brand/**'
      - 'README.md'
      - 'guides/**'
      - 'docs/**'
      - 'mix.exs'
      - '.github/workflows/website.yml'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'brand/**'
      - 'README.md'
      - 'guides/**'
      - 'docs/**'
      - 'mix.exs'
      - '.github/workflows/website.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to build and redeploy (the rollback input). Defaults to main.'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SCRYPATH_SITE_URL: https://sztheory.github.io/scrypath/
      SCRYPATH_REPO_URL: https://github.com/szTheory/scrypath

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Select browser (runner Chrome when launchable, else Playwright Chromium)
        working-directory: website
        run: |
          if google-chrome --version \
            && node -e "import('playwright').then(async ({ chromium }) => { const browser = await chromium.launch({ channel: 'chrome' }); await browser.close(); })"; then
            echo "Using the runner's $(google-chrome --version) through Playwright's chrome channel"
            echo "SCRYPATH_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "Runner Chrome is missing or not launchable; installing Playwright Chromium"
            npx playwright install --with-deps chromium
          fi

      - name: Run site checks
        working-directory: website
        run: npm run check

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scrypath-website-screenshots
          path: website/artifacts
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-check
    runs-on: ubuntu-24.04
    concurrency:
      group: website-pages-deploy
      cancel-in-progress: false
    env:
      SCRYPATH_SITE_URL: https://sztheory.github.io/scrypath/
      SCRYPATH_REPO_URL: https://github.com/szTheory/scrypath
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke test the deployed site
        env:
          SCRYPATH_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -f website/scripts/smoke.mjs ]; then
            node website/scripts/smoke.mjs
          else
            echo "This ref predates website/scripts/smoke.mjs; running the soft check only."
            site="${SCRYPATH_SMOKE_URL%/}"
            curl -fsSI --retry 3 --retry-delay 10 --retry-all-errors "${site}/?smoke=${GITHUB_RUN_ID}"
            curl -fsSI --retry 3 --retry-delay 10 --retry-all-errors "${site}/assets/styles.css?smoke=${GITHUB_RUN_ID}"
          fi
