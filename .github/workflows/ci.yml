name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      phase182_cache_mode:
        description: Optional cache acceptance probe to run in the existing CI jobs
        type: choice
        default: normal
        options:
          - normal
          - docker-cold
          - beam-cold
          - beam-fallback
          - beam-lock-change
      phase182_probe_namespace:
        description: Optional isolated lowercase cache namespace (empty uses the production namespace)
        type: string
        default: ""
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (required)
    runs-on: ubuntu-latest
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: root-test}
    steps:
      # UAT-09 asserts a release-history subject from the root test suite.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - name: Validate Phase 182 cache probe inputs
        id: phase182_inputs
        env:
          PHASE182_CACHE_MODE: ${{ inputs.phase182_cache_mode || 'normal' }}
          PHASE182_PROBE_NAMESPACE: ${{ inputs.phase182_probe_namespace || '' }}
        run: node scripts/ci/phase182_acceptance.cjs validate-inputs --output "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - name: Prepare isolated comment-only lock probe checkout
        id: phase182_lock_probe
        if: steps.phase182_inputs.outputs.mode == 'beam-lock-change'
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/ci/phase182_acceptance.cjs prepare-lock --output "$GITHUB_OUTPUT"
      - id: beam_cache
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.beam_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.beam_namespace }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PHASE182_BEAM_ROOT: ${{ steps.phase182_lock_probe.outputs.beam_root || github.workspace }}
          PHASE182_BEAM_PLAN: ${{ runner.temp }}/phase182-beam-cache-plan.json
        run: node scripts/ci/phase182_acceptance.cjs beam-plan --graph root --root "$PHASE182_BEAM_ROOT" --output "$PHASE182_BEAM_PLAN" --output-github "$GITHUB_OUTPUT"
      - id: phase182_downloads_cache
        name: Restore Hex download archive cache
        if: steps.phase182_inputs.outputs.mode != 'beam-cold'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - id: phase182_resolved_cache
        name: Restore resolved BEAM build cache
        if: steps.phase182_inputs.outputs.mode != 'beam-cold'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - id: mix_deps_get
        run: mix deps.get
        working-directory: ${{ steps.phase182_lock_probe.outputs.beam_root || github.workspace }}
      - id: phase182_compile
        if: startsWith(steps.phase182_inputs.outputs.mode, 'beam-')
        run: mix compile --warnings-as-errors
        working-directory: ${{ steps.phase182_lock_probe.outputs.beam_root || github.workspace }}
      - id: core_verify
        run: mix verify.core --exclude integration --exclude docs_contract
        working-directory: ${{ steps.phase182_lock_probe.outputs.beam_root || github.workspace }}
      - name: Save Hex download archive cache
        if: success() && steps.phase182_inputs.outputs.mode != 'beam-cold' && steps.core_verify.outcome == 'success' && steps.phase182_downloads_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
      - name: Save resolved BEAM build cache
        if: success() && steps.phase182_inputs.outputs.mode != 'beam-cold' && steps.core_verify.outcome == 'success' && steps.phase182_resolved_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
      - name: Write Phase 182 BEAM cache proof
        id: phase182_beam_proof
        if: always() && startsWith(steps.phase182_inputs.outputs.mode, 'beam-')
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mode }}
          PHASE182_BEAM_PLAN: ${{ runner.temp }}/phase182-beam-cache-plan.json
          PHASE182_LOCK_PROBE_MANIFEST: ${{ steps.phase182_lock_probe.outputs.lock_manifest }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          DOWNLOADS_CACHE_HIT: ${{ steps.phase182_downloads_cache.outputs.cache-hit }}
          DOWNLOADS_MATCHED_KEY: ${{ steps.phase182_downloads_cache.outputs.cache-matched-key }}
          RESOLVED_CACHE_HIT: ${{ steps.phase182_resolved_cache.outputs.cache-hit }}
          RESOLVED_MATCHED_KEY: ${{ steps.phase182_resolved_cache.outputs.cache-matched-key }}
          DEPS_GET_OUTCOME: ${{ steps.mix_deps_get.outcome }}
          COMPILE_OUTCOME: ${{ steps.phase182_compile.outcome }}
          VERIFY_OUTCOME: ${{ steps.core_verify.outcome }}
        run: node scripts/ci/phase182_acceptance.cjs write-beam-proof --plan "$PHASE182_BEAM_PLAN" --output "$RUNNER_TEMP/phase182-cache-proof.json"
      - name: Upload Phase 182 BEAM cache proof
        if: always() && startsWith(steps.phase182_inputs.outputs.mode, 'beam-') && steps.phase182_beam_proof.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase182-cache-probe-${{ steps.phase182_inputs.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase182-cache-proof.json
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (required)
    runs-on: ubuntu-latest
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: root-test}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - run: mix verify.package

  repository-contracts:
    name: repository-contracts (required)
    runs-on: ubuntu-latest
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: root-test}
    steps:
      # UAT-09 checks a release-history subject, so the contract suite requires
      # history beyond checkout's default depth of one.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - name: Verify browser build, lifecycle, evidence, and target behavior
        run: |
          node --test --test-reporter=tap \
            scripts/ci/ecommerce_build.test.cjs \
            scripts/ci/ecommerce_lifecycle.test.cjs \
            scripts/ci/ecommerce_evidence.test.cjs \
            scripts/ci/ecommerce_target.test.cjs | tee "$RUNNER_TEMP/browser-behavior.tap"
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/browser-behavior.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/browser-behavior.tap"
      - run: mix verify.repository_contracts

  backend:
    name: backend (required)
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports: [7700:7700]
        env: {MEILI_NO_ANALYTICS: "true"}
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5434:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700
      SCRYPATH_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5434
      MIX_ENV: test
      MIX_TARGET: host
      BEAM_CACHE_PROFILE: root-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" && exit 0; sleep 2; done
          echo "Meilisearch failed to start"; exit 1
      - run: mix verify.backend
      - name: Backend failure diagnostics
        if: failure()
        run: |
          curl -sv --max-time 5 "$SCRYPATH_MEILISEARCH_URL/health" || true
          docker ps -a
          container_ids="$(docker ps -aq --filter ancestor=getmeili/meilisearch:v1.15)"
          if [ -n "$container_ids" ]; then docker logs "$container_ids" || true; fi
          postgres_ids="$(docker ps -aq --filter ancestor=postgres:16-alpine)"
          if [ -n "$postgres_ids" ]; then docker logs "$postgres_ids" || true; fi

  compatibility:
    name: compatibility (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: root-test}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1.17.3", otp: "26.2.5"}
          - {elixir: "1.18.4", otp: "27.3"}
          - {elixir: "1.19.0", otp: "26.2.5"}
          - {elixir: "1.19.0", otp: "28.1"}
    steps:
      # The compatibility lane also runs the root test suite, including UAT-09.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "${{ matrix.elixir }}", otp-version: "${{ matrix.otp }}"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - run: mix verify.compatibility

  deep-quality:
    name: deep-quality (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: deep-quality-test}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - run: mix local.hex 2.5.1 --force
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.plt_paths }}
          key: ${{ steps.beam_cache.outputs.plt_key }}
      - run: mix deps.get
      - run: elixir scripts/ci/dependency_audit.exs
      - run: mix run --no-start -e 'Mix.Tasks.Verify.Capability.run_deep_quality_without_audit()'

  phoenix-example:
    name: phoenix-example (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5433:5432]
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports: [7700:7700]
        env: {MEILI_NO_ANALYTICS: "true"}
    env: {PGPORT: "5433", SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700, SCRYPATH_EXAMPLE_INTEGRATION: "1", MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: phoenix-test}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph phoenix-example --output "$RUNNER_TEMP/beam-cache-phoenix.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - run: mix verify.phoenix_example
      - run: mix verify.phoenix_example --package

  ops-ui-path:
    runs-on: ubuntu-latest
    outputs: {run: "${{ steps.check.outputs.run }}"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - id: check
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then git fetch origin "$GITHUB_BASE_REF" --depth=1; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(scrypath_ops/|lib/|dev/|mix\.exs|mix\.lock)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  ops-ui:
    name: ops-ui (path-scoped)
    needs: ops-ui-path
    if: needs.ops-ui-path.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: {PGPORT: "5433", MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: ops-test}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph ops --output "$RUNNER_TEMP/beam-cache-ops.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - run: mix verify.ops_ui

  ecommerce-mounted:
    name: ecommerce-mounted (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILDER_ID: scrypath-mounted-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_CACHE_JOB: mounted
      E2E_EVENT_NAME: ${{ github.event_name }}
      E2E_PROJECT_NAME: scrypath-e2e-${{ github.run_id }}-${{ github.run_attempt }}-mounted
      E2E_SCOPE: focused
      E2E_SOURCE_MODE: hosted
      SCRYPATH_SOURCE_SHA: ${{ github.sha }}
      MIX_ENV: test
      MIX_TARGET: host
      BEAM_CACHE_PROFILE: ecommerce-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Phase 182 cache probe inputs
        id: phase182_inputs
        env:
          PHASE182_CACHE_MODE: ${{ inputs.phase182_cache_mode || 'normal' }}
          PHASE182_PROBE_NAMESPACE: ${{ inputs.phase182_probe_namespace || '' }}
        run: node scripts/ci/phase182_acceptance.cjs validate-inputs --output "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        env:
          # Keep the application BEAM cache graph stable for every Docker probe mode.
          PHASE182_CACHE_MODE: normal
          PHASE182_PROBE_NAMESPACE: ""
        run: node scripts/ci/beam_cache.cjs plan --graph ecommerce --output "$RUNNER_TEMP/beam-cache-ecommerce.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - name: Prepare checked mounted Compose images
        id: ecommerce_prepare
        shell: bash
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mounted_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.mounted_docker_namespace }}
        run: |
          output_dir="$RUNNER_TEMP/ecommerce-mounted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/ecommerce_build.cjs prepare --scope focused --output "$output_dir"
          {
            echo "E2E_PREBUILT_MANIFEST=$output_dir/image-handoff.json"
            echo "E2E_IMAGE_OVERRIDE=$output_dir/image-override.json"
          } >> "$GITHUB_ENV"
      - name: Configure scoped mounted Docker cache probe
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mounted_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.mounted_docker_namespace }}
          E2E_PREBUILT_MANIFEST: ${{ runner.temp }}/ecommerce-mounted-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
        run: node scripts/ci/phase182_acceptance.cjs configure-docker --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Record pre-probe Buildx builders
        if: steps.phase182_inputs.outputs.mode == 'docker-cold'
        run: docker buildx ls --format '{{.Name}}' > "$RUNNER_TEMP/phase182-builders-before.txt"
      - name: Set up pinned Buildx for mounted Compose images
        id: ecommerce_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, immutable signed Docker release
        with:
          name: ${{ env.BUILDER_ID }}
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Inspect newly created mounted Buildx builder
        if: steps.phase182_inputs.outputs.mode == 'docker-cold'
        run: docker buildx inspect "$BUILDER_ID" --bootstrap > "$RUNNER_TEMP/phase182-builder-inspect.txt"
      - name: Bake and load checked mounted images
        id: ecommerce_bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0, immutable signed Docker release
        with:
          source: .
          files: ${{ runner.temp }}/ecommerce-mounted-${{ github.run_id }}-${{ github.run_attempt }}/bake.json
          load: true
          push: false
          progress: plain
      - name: Verify mounted image handoff
        id: ecommerce_handoff
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mounted_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.mounted_docker_namespace }}
        run: node scripts/ci/ecommerce_build.cjs verify-handoff --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Record mounted cache interaction outcome
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          BAKE_OUTCOME: ${{ steps.ecommerce_bake.outcome }}
          HANDOFF_OUTCOME: ${{ steps.ecommerce_handoff.outcome }}
        run: node scripts/ci/ecommerce_build.cjs cache-outcome --manifest "$E2E_PREBUILT_MANIFEST" --bake-outcome "$BAKE_OUTCOME" --handoff-outcome "$HANDOFF_OUTCOME"
      - name: Warn when mounted Bake needs cache fallback
        if: steps.ecommerce_bake.outcome == 'failure' && steps.ecommerce_handoff.outcome == 'success'
        run: echo "::warning title=BuildKit cache performance::Bake returned failure after the checked images loaded. Inspect Docker Bake logs; image handoff is valid and mounted verification will continue."
      - name: Run mounted E2E proof
        id: mounted_verify
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mounted_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.mounted_docker_namespace }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: mix verify.ecommerce_mounted
      - name: Write Phase 182 Docker cold-cache proof
        id: phase182_docker_proof
        if: always() && steps.phase182_inputs.outputs.mode == 'docker-cold'
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.mounted_docker_mode }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILDER_ID: ${{ env.BUILDER_ID }}
          PRIMARY_VERIFICATION_OUTCOME: ${{ steps.mounted_verify.outcome }}
        run: node scripts/ci/phase182_acceptance.cjs write-docker-proof --manifest "$E2E_PREBUILT_MANIFEST" --output "$RUNNER_TEMP/phase182-cache-proof.json" --baseline "$RUNNER_TEMP/phase182-builders-before.txt" --inspect "$RUNNER_TEMP/phase182-builder-inspect.txt"
      - name: Upload Phase 182 Docker cold-cache proof
        if: always() && steps.phase182_inputs.outputs.mode == 'docker-cold' && steps.phase182_docker_proof.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase182-cache-probe-docker-cold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase182-cache-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload mounted E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecommerce-mounted-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/scrypath_ecommerce/test-results/docker-focused/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/ecommerce-mounted-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env: {MIX_ENV: test, MIX_TARGET: host, BEAM_CACHE_PROFILE: coverage-test}
    outputs:
      verification_outcome: ${{ steps.coverage_verify.outcome }}
      artifact_id: ${{ steps.coverage_upload.outputs.artifact-id }}
      artifact_url: ${{ steps.coverage_upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.coverage_upload.outputs.artifact-digest }}
    steps:
      # Coverage runs the root test suite, which validates release history in UAT-09.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        run: node scripts/ci/beam_cache.cjs plan --graph root --output "$RUNNER_TEMP/beam-cache-root.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - name: Run informational coverage
        id: coverage_verify
        run: mix verify.coverage
      - name: Upload informational coverage report
        id: coverage_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ github.sha }}
          path: cover/
          if-no-files-found: warn
          retention-days: 7

  closeout-attestation:
    name: closeout-attestation
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [core, package, repository-contracts, backend, ecommerce-mounted, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-SHA closeout inputs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          REPOSITORY_CONTRACTS_RESULT: ${{ needs.repository-contracts.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ECOMMERCE_MOUNTED_RESULT: ${{ needs.ecommerce-mounted.result }}
          COVERAGE_OUTCOME: ${{ needs.coverage.outputs.verification_outcome }}
          COVERAGE_ARTIFACT_ID: ${{ needs.coverage.outputs.artifact_id }}
          COVERAGE_ARTIFACT_URL: ${{ needs.coverage.outputs.artifact_url }}
          COVERAGE_ARTIFACT_DIGEST: ${{ needs.coverage.outputs.artifact_digest }}
        run: |
          test "$CORE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$REPOSITORY_CONTRACTS_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$ECOMMERCE_MOUNTED_RESULT" = success
          test "$COVERAGE_OUTCOME" = success
          test -n "$COVERAGE_ARTIFACT_ID"
          test -n "$COVERAGE_ARTIFACT_URL"
          test -n "$COVERAGE_ARTIFACT_DIGEST"
          jq -n \
            --arg authority "github-actions-exact-sha" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg coverage_artifact_id "$COVERAGE_ARTIFACT_ID" \
            --arg coverage_artifact_url "$COVERAGE_ARTIFACT_URL" \
            --arg coverage_artifact_digest "$COVERAGE_ARTIFACT_DIGEST" \
            '{schema: 1, authority: $authority, repository: $repository, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url, event: $event, head_sha: $head_sha, required_jobs: ["core (required)", "package (required)", "repository-contracts (required)", "backend (required)", "ecommerce-mounted (required)"], coverage: {outcome: "success", artifact_id: $coverage_artifact_id, artifact_url: $coverage_artifact_url, artifact_digest: $coverage_artifact_digest}}' \
            > closeout-attestation.json
      - name: Upload exact-SHA closeout attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closeout-attestation-${{ github.sha }}
          path: closeout-attestation.json
          if-no-files-found: error
          retention-days: 7

  ecommerce-e2e:
    name: ecommerce-e2e (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      BUILDER_ID: scrypath-full-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_CACHE_JOB: full
      E2E_EVENT_NAME: ${{ github.event_name }}
      E2E_PROJECT_NAME: scrypath-e2e-${{ github.run_id }}-${{ github.run_attempt }}-full
      E2E_SCOPE: full
      SCRYPATH_SOURCE_SHA: ${{ github.sha }}
      MIX_ENV: test
      MIX_TARGET: host
      BEAM_CACHE_PROFILE: ecommerce-test
    outputs:
      verification_outcome: ${{ steps.ecommerce_verify.outcome }}
      artifact_id: ${{ steps.ecommerce_upload.outputs.artifact-id }}
      artifact_url: ${{ steps.ecommerce_upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.ecommerce_upload.outputs.artifact-digest }}
    steps:
      - name: Record E2E job start and deadline
        id: e2e_clock
        shell: bash
        run: |
          E2E_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          E2E_JOB_STARTED_EPOCH=$(date -u +%s)
          E2E_DEADLINE_EPOCH=$((E2E_JOB_STARTED_EPOCH + 1800))
          E2E_FINALIZATION_MARGIN_SECONDS=300
          {
            echo "E2E_JOB_STARTED_AT=$E2E_JOB_STARTED_AT"
            echo "E2E_JOB_STARTED_EPOCH=$E2E_JOB_STARTED_EPOCH"
            echo "E2E_DEADLINE_EPOCH=$E2E_DEADLINE_EPOCH"
            echo "E2E_FINALIZATION_MARGIN_SECONDS=$E2E_FINALIZATION_MARGIN_SECONDS"
            echo "E2E_EVENT_NAME=$GITHUB_EVENT_NAME"
            echo "E2E_GIT_REF=$GITHUB_REF"
            echo "E2E_EVENT_SHA=$GITHUB_SHA"
            echo "E2E_WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "E2E_WORKFLOW_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "E2E_JOB_NAME=ecommerce-e2e (advisory)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - name: Verify checked-out source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate Phase 182 cache probe inputs
        id: phase182_inputs
        env:
          PHASE182_CACHE_MODE: ${{ inputs.phase182_cache_mode || 'normal' }}
          PHASE182_PROBE_NAMESPACE: ${{ inputs.phase182_probe_namespace || '' }}
        run: node scripts/ci/phase182_acceptance.cjs validate-inputs --output "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - id: beam_cache
        env:
          # Keep the application BEAM cache graph stable for every Docker probe mode.
          PHASE182_CACHE_MODE: normal
          PHASE182_PROBE_NAMESPACE: ""
        run: node scripts/ci/beam_cache.cjs plan --graph ecommerce --output "$RUNNER_TEMP/beam-cache-ecommerce.json"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.hex/packages
          key: ${{ steps.beam_cache.outputs.downloads_key }}
          restore-keys: ${{ steps.beam_cache.outputs.downloads_restore_prefix }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.beam_cache.outputs.resolved_paths }}
          key: ${{ steps.beam_cache.outputs.resolved_key }}
          restore-keys: ${{ steps.beam_cache.outputs.resolved_restore_prefix }}
      - run: mix deps.get
      - name: Prepare checked full Compose images
        id: ecommerce_prepare
        shell: bash
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.full_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.full_docker_namespace }}
        run: |
          output_dir="$RUNNER_TEMP/ecommerce-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/ecommerce_build.cjs prepare --scope full --output "$output_dir"
          {
            echo "E2E_PREBUILT_MANIFEST=$output_dir/image-handoff.json"
            echo "E2E_IMAGE_OVERRIDE=$output_dir/image-override.json"
          } >> "$GITHUB_ENV"
      - name: Configure scoped full Docker cache namespace
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.full_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.full_docker_namespace }}
          E2E_PREBUILT_MANIFEST: ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
        run: node scripts/ci/phase182_acceptance.cjs configure-docker --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Set up pinned Buildx for full Compose images
        id: ecommerce_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, immutable signed Docker release
        with:
          name: ${{ env.BUILDER_ID }}
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Bake and load checked full images
        id: ecommerce_bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0, immutable signed Docker release
        with:
          source: .
          files: ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/bake.json
          load: true
          push: false
          progress: plain
      - name: Verify full image handoff
        id: ecommerce_handoff
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.full_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.full_docker_namespace }}
        run: node scripts/ci/ecommerce_build.cjs verify-handoff --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Record full cache interaction outcome
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          BAKE_OUTCOME: ${{ steps.ecommerce_bake.outcome }}
          HANDOFF_OUTCOME: ${{ steps.ecommerce_handoff.outcome }}
        run: node scripts/ci/ecommerce_build.cjs cache-outcome --manifest "$E2E_PREBUILT_MANIFEST" --bake-outcome "$BAKE_OUTCOME" --handoff-outcome "$HANDOFF_OUTCOME"
      - name: Warn when full Bake needs cache fallback
        if: steps.ecommerce_bake.outcome == 'failure' && steps.ecommerce_handoff.outcome == 'success'
        run: echo "::warning title=BuildKit cache performance::Bake returned failure after the checked images loaded. Inspect Docker Bake logs; image handoff is valid and full verification will continue."
      - name: Run advisory full E2E proof
        id: ecommerce_verify
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.full_docker_mode }}
          PHASE182_PROBE_NAMESPACE: ${{ steps.phase182_inputs.outputs.full_docker_namespace }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_JOB_STARTED_AT: ${{ steps.e2e_clock.outputs.E2E_JOB_STARTED_AT }}
          E2E_DEADLINE_EPOCH: ${{ steps.e2e_clock.outputs.E2E_DEADLINE_EPOCH }}
          E2E_FINALIZATION_MARGIN_SECONDS: ${{ steps.e2e_clock.outputs.E2E_FINALIZATION_MARGIN_SECONDS }}
          E2E_SOURCE_MODE: hosted
          E2E_EVENT_NAME: ${{ steps.e2e_clock.outputs.E2E_EVENT_NAME }}
          E2E_GIT_REF: ${{ steps.e2e_clock.outputs.E2E_GIT_REF }}
          E2E_EVENT_SHA: ${{ steps.e2e_clock.outputs.E2E_EVENT_SHA }}
          E2E_WORKFLOW_RUN_ID: ${{ steps.e2e_clock.outputs.E2E_WORKFLOW_RUN_ID }}
          E2E_WORKFLOW_RUN_ATTEMPT: ${{ steps.e2e_clock.outputs.E2E_WORKFLOW_RUN_ATTEMPT }}
          E2E_JOB_NAME: ${{ steps.e2e_clock.outputs.E2E_JOB_NAME }}
        run: mix verify.ecommerce_e2e
      - name: Write Phase 182 Docker warm-cache proof
        id: phase182_docker_proof
        if: always() && steps.phase182_inputs.outputs.mode == 'normal'
        env:
          PHASE182_CACHE_MODE: ${{ steps.phase182_inputs.outputs.full_docker_mode }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRIMARY_VERIFICATION_OUTCOME: ${{ steps.ecommerce_verify.outcome }}
          E2E_PREBUILT_MANIFEST: ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
        run: node scripts/ci/phase182_acceptance.cjs write-docker-proof --manifest "$E2E_PREBUILT_MANIFEST" --output "$RUNNER_TEMP/phase182-cache-proof.json"
      - name: Upload Phase 182 Docker warm-cache proof
        if: always() && steps.phase182_inputs.outputs.mode == 'normal' && steps.phase182_docker_proof.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase182-cache-probe-docker-warm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase182-cache-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload advisory E2E evidence
        id: ecommerce_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecommerce-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/scrypath_ecommerce/test-results/docker-full/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
          if-no-files-found: error
          retention-days: 7
