name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.3"
            otp: "26.2.5"
          - elixir: "1.19.0"
            otp: "28.1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --exclude integration --exclude docs_contract --include requires_clean_workspace

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release-please-config.json
        run: jq empty release-please-config.json

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile scrypath_ops without optional deps (SIGRA-02)
        working-directory: scrypath_ops
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix compile --no-optional-deps --warnings-as-errors

      - name: Run namespace fence (`mix scrypath.namespace_fence`)
        run: mix scrypath.namespace_fence

      - name: Check formatting
        run: mix format --check-formatted

      - name: Verify workspace is clean
        run: mix verify.workspace_clean

      - name: Run Credo
        run: mix credo

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Build docs
        run: mix docs --warnings-as-errors

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Release contract gate (`mix verify.phase11`)
        run: mix verify.phase11

      - name: Operator checks (`mix verify.phase13 --skip-integration`)
        run: mix verify.phase13 --skip-integration

      - name: Operator Mix + docs gate (`mix verify.phase14`)
        run: mix verify.phase14

      - name: Faceting + guide gate (`mix verify.phase20`)
        run: mix verify.phase20

      - name: Operator polish + drift recovery gate (`mix verify.phase22`)
        run: mix verify.phase22

      - name: Failure rollups gate (`mix verify.phase26`)
        run: mix verify.phase26

      - name: Index contract drift CLI gate (`mix verify.phase28`)
        run: mix verify.phase28

      - name: Federation docs gate (`mix verify.phase41`)
        run: mix verify.phase41

      - name: Per-query runtime gate (`mix verify.phase43`)
        run: mix verify.phase43

      - name: Request-edge docs/examples gate (`mix verify.phase82`)
        run: mix verify.phase82

      - name: Related-data + docs-contract gate (`mix verify.phase91`)
        run: mix verify.phase91

  adopter-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-adopter-verify-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Adopter verify (`mix verify.adopter`)
        run: mix verify.adopter

  phase5-verification:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-phase5-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Backfill + integration verification (`mix verify.phase5`)
        run: mix verify.phase5

  phase13-verification:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.0"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-phase13-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Operator integration verification (`mix verify.phase13`)
        run: mix verify.phase13

  meilisearch-smoke:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-meilisearch-smoke-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Run Meilisearch integration smoke
        run: mix verify.meilisearch_smoke

  phoenix-example-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432

      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      PGPORT: "5433"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700
      SCRYPATH_EXAMPLE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            examples/phoenix_meilisearch/deps
            examples/phoenix_meilisearch/_build
          key: ${{ runner.os }}-phx-example-${{ hashFiles('examples/phoenix_meilisearch/mix.lock') }}-${{ hashFiles('mix.lock') }}

      - name: Install postgres client (pg_isready)
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p "$PGPORT" -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to become ready"
          exit 1

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Phoenix example integration (`cd examples/phoenix_meilisearch && mix deps.get && mix test`)
        run: |
          cd examples/phoenix_meilisearch
          mix deps.get
          mix test

  # Path gate for OPSUI: always run on push to main; on pull_request only when
  # library or scrypath_ops paths change (see phase 47 CONTEXT D-03).
  scrypath-ops-path-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether OPSUI CI should run
        id: check
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qE '^(scrypath_ops/|lib/|mix\.exs|mix\.lock|scrypath_ops/mix\.lock)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"

  scrypath-ops:
    needs: scrypath-ops-path-check
    if: needs.scrypath-ops-path-check.outputs.run == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432

    env:
      PGPORT: "5433"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            scrypath_ops/deps
            scrypath_ops/_build
          key: ${{ runner.os }}-scrypath-ops-${{ hashFiles('mix.lock', 'scrypath_ops/mix.lock') }}

      - name: Install postgres client (pg_isready)
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p "$PGPORT" -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to become ready"
          exit 1

      - name: ScrypathOps tests
        run: |
          cd scrypath_ops
          mix deps.get
          mix test
