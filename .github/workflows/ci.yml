name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (required)
    runs-on: ubuntu-latest
    steps:
      # UAT-09 asserts a release-history subject from the root test suite.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.core --exclude integration --exclude docs_contract

  package:
    name: package (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.package

  repository-contracts:
    name: repository-contracts (required)
    runs-on: ubuntu-latest
    steps:
      # UAT-09 checks a release-history subject, so the contract suite requires
      # history beyond checkout's default depth of one.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.repository_contracts

  backend:
    name: backend (required)
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports: [7700:7700]
        env: {MEILI_NO_ANALYTICS: "true"}
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5434:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700
      SCRYPATH_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5434
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" && exit 0; sleep 2; done
          echo "Meilisearch failed to start"; exit 1
      - run: mix verify.backend
      - name: Backend failure diagnostics
        if: failure()
        run: |
          curl -sv --max-time 5 "$SCRYPATH_MEILISEARCH_URL/health" || true
          docker ps -a
          container_ids="$(docker ps -aq --filter ancestor=getmeili/meilisearch:v1.15)"
          if [ -n "$container_ids" ]; then docker logs "$container_ids" || true; fi
          postgres_ids="$(docker ps -aq --filter ancestor=postgres:16-alpine)"
          if [ -n "$postgres_ids" ]; then docker logs "$postgres_ids" || true; fi

  compatibility:
    name: compatibility (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1.17.3", otp: "26.2.5"}
          - {elixir: "1.18.4", otp: "27.3"}
          - {elixir: "1.19.0", otp: "26.2.5"}
          - {elixir: "1.19.0", otp: "28.1"}
    steps:
      # The compatibility lane also runs the root test suite, including UAT-09.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "${{ matrix.elixir }}", otp-version: "${{ matrix.otp }}"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.compatibility

  deep-quality:
    name: deep-quality (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - run: mix local.hex 2.5.1 --force
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-deep-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: elixir scripts/ci/dependency_audit.exs
      - run: mix run --no-start -e 'Mix.Tasks.Verify.Capability.run_deep_quality_without_audit()'
        env:
          MIX_ENV: test

  phoenix-example:
    name: phoenix-example (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5433:5432]
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports: [7700:7700]
        env: {MEILI_NO_ANALYTICS: "true"}
    env: {PGPORT: "5433", SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700, SCRYPATH_EXAMPLE_INTEGRATION: "1"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.phoenix_example
      - run: mix verify.phoenix_example --package

  ops-ui-path:
    runs-on: ubuntu-latest
    outputs: {run: "${{ steps.check.outputs.run }}"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - id: check
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then git fetch origin "$GITHUB_BASE_REF" --depth=1; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(scrypath_ops/|lib/|mix\.exs|mix\.lock)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  ops-ui:
    name: ops-ui (path-scoped)
    needs: ops-ui-path
    if: needs.ops-ui-path.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: {PGPORT: "5433"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - run: mix verify.ops_ui

  ecommerce-mounted:
    name: ecommerce-mounted (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILDER_ID: scrypath-mounted-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_CACHE_JOB: mounted
      E2E_EVENT_NAME: ${{ github.event_name }}
      E2E_PROJECT_NAME: scrypath-e2e-${{ github.run_id }}-${{ github.run_attempt }}-mounted
      E2E_SCOPE: focused
      E2E_SOURCE_MODE: hosted
      SCRYPATH_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - name: Prepare checked mounted Compose images
        id: ecommerce_prepare
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/ecommerce-mounted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/ecommerce_build.cjs prepare --scope focused --output "$output_dir"
          {
            echo "E2E_PREBUILT_MANIFEST=$output_dir/image-handoff.json"
            echo "E2E_IMAGE_OVERRIDE=$output_dir/image-override.json"
          } >> "$GITHUB_ENV"
      - name: Set up pinned Buildx for mounted Compose images
        id: ecommerce_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, immutable signed Docker release
        with:
          name: ${{ env.BUILDER_ID }}
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Bake and load checked mounted images
        id: ecommerce_bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0, immutable signed Docker release
        with:
          source: .
          files: ${{ runner.temp }}/ecommerce-mounted-${{ github.run_id }}-${{ github.run_attempt }}/bake.json
          load: true
          push: false
          progress: plain
      - name: Verify mounted image handoff
        id: ecommerce_handoff
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        run: node scripts/ci/ecommerce_build.cjs verify-handoff --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Record mounted cache interaction outcome
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          BAKE_OUTCOME: ${{ steps.ecommerce_bake.outcome }}
          HANDOFF_OUTCOME: ${{ steps.ecommerce_handoff.outcome }}
        run: node scripts/ci/ecommerce_build.cjs cache-outcome --manifest "$E2E_PREBUILT_MANIFEST" --bake-outcome "$BAKE_OUTCOME" --handoff-outcome "$HANDOFF_OUTCOME"
      - name: Warn when mounted Bake needs cache fallback
        if: steps.ecommerce_bake.outcome == 'failure' && steps.ecommerce_handoff.outcome == 'success'
        run: echo "::warning title=BuildKit cache performance::Bake returned failure after the checked images loaded. Inspect Docker Bake logs; image handoff is valid and mounted verification will continue."
      - name: Run mounted E2E proof
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: mix verify.ecommerce_mounted
      - name: Upload mounted E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecommerce-mounted-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/scrypath_ecommerce/test-results/docker-focused/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/ecommerce-mounted-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      verification_outcome: ${{ steps.coverage_verify.outcome }}
      artifact_id: ${{ steps.coverage_upload.outputs.artifact-id }}
      artifact_url: ${{ steps.coverage_upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.coverage_upload.outputs.artifact-digest }}
    steps:
      # Coverage runs the root test suite, which validates release history in UAT-09.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - name: Run informational coverage
        id: coverage_verify
        run: mix verify.coverage
      - name: Upload informational coverage report
        id: coverage_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ github.sha }}
          path: cover/
          if-no-files-found: warn
          retention-days: 7

  closeout-attestation:
    name: closeout-attestation
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [core, package, repository-contracts, backend, ecommerce-mounted, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-SHA closeout inputs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          REPOSITORY_CONTRACTS_RESULT: ${{ needs.repository-contracts.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ECOMMERCE_MOUNTED_RESULT: ${{ needs.ecommerce-mounted.result }}
          COVERAGE_OUTCOME: ${{ needs.coverage.outputs.verification_outcome }}
          COVERAGE_ARTIFACT_ID: ${{ needs.coverage.outputs.artifact_id }}
          COVERAGE_ARTIFACT_URL: ${{ needs.coverage.outputs.artifact_url }}
          COVERAGE_ARTIFACT_DIGEST: ${{ needs.coverage.outputs.artifact_digest }}
        run: |
          test "$CORE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$REPOSITORY_CONTRACTS_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$ECOMMERCE_MOUNTED_RESULT" = success
          test "$COVERAGE_OUTCOME" = success
          test -n "$COVERAGE_ARTIFACT_ID"
          test -n "$COVERAGE_ARTIFACT_URL"
          test -n "$COVERAGE_ARTIFACT_DIGEST"
          jq -n \
            --arg authority "github-actions-exact-sha" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg coverage_artifact_id "$COVERAGE_ARTIFACT_ID" \
            --arg coverage_artifact_url "$COVERAGE_ARTIFACT_URL" \
            --arg coverage_artifact_digest "$COVERAGE_ARTIFACT_DIGEST" \
            '{schema: 1, authority: $authority, repository: $repository, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url, event: $event, head_sha: $head_sha, required_jobs: ["core (required)", "package (required)", "repository-contracts (required)", "backend (required)", "ecommerce-mounted (required)"], coverage: {outcome: "success", artifact_id: $coverage_artifact_id, artifact_url: $coverage_artifact_url, artifact_digest: $coverage_artifact_digest}}' \
            > closeout-attestation.json
      - name: Upload exact-SHA closeout attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: closeout-attestation-${{ github.sha }}
          path: closeout-attestation.json
          if-no-files-found: error
          retention-days: 7

  ecommerce-e2e:
    name: ecommerce-e2e (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      BUILDER_ID: scrypath-full-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_CACHE_JOB: full
      E2E_EVENT_NAME: ${{ github.event_name }}
      E2E_PROJECT_NAME: scrypath-e2e-${{ github.run_id }}-${{ github.run_attempt }}-full
      E2E_SCOPE: full
      SCRYPATH_SOURCE_SHA: ${{ github.sha }}
    outputs:
      verification_outcome: ${{ steps.ecommerce_verify.outcome }}
      artifact_id: ${{ steps.ecommerce_upload.outputs.artifact-id }}
      artifact_url: ${{ steps.ecommerce_upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.ecommerce_upload.outputs.artifact-digest }}
    steps:
      - name: Record E2E job start and deadline
        id: e2e_clock
        shell: bash
        run: |
          E2E_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          E2E_JOB_STARTED_EPOCH=$(date -u +%s)
          E2E_DEADLINE_EPOCH=$((E2E_JOB_STARTED_EPOCH + 1800))
          E2E_FINALIZATION_MARGIN_SECONDS=300
          {
            echo "E2E_JOB_STARTED_AT=$E2E_JOB_STARTED_AT"
            echo "E2E_JOB_STARTED_EPOCH=$E2E_JOB_STARTED_EPOCH"
            echo "E2E_DEADLINE_EPOCH=$E2E_DEADLINE_EPOCH"
            echo "E2E_FINALIZATION_MARGIN_SECONDS=$E2E_FINALIZATION_MARGIN_SECONDS"
            echo "E2E_EVENT_NAME=$GITHUB_EVENT_NAME"
            echo "E2E_GIT_REF=$GITHUB_REF"
            echo "E2E_EVENT_SHA=$GITHUB_SHA"
            echo "E2E_WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "E2E_WORKFLOW_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "E2E_JOB_NAME=ecommerce-e2e (advisory)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - name: Verify checked-out source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with: {elixir-version: "1.19.0", otp-version: "28.1"}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |-
            deps
            _build
          key: ${{ runner.os }}-test-elixir-1.19.0-otp-28.1-${{ hashFiles('mix.lock', 'mix.exs') }}
      - run: mix deps.get
      - name: Prepare checked full Compose images
        id: ecommerce_prepare
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/ecommerce-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/ecommerce_build.cjs prepare --scope full --output "$output_dir"
          {
            echo "E2E_PREBUILT_MANIFEST=$output_dir/image-handoff.json"
            echo "E2E_IMAGE_OVERRIDE=$output_dir/image-override.json"
          } >> "$GITHUB_ENV"
      - name: Set up pinned Buildx for full Compose images
        id: ecommerce_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, immutable signed Docker release
        with:
          name: ${{ env.BUILDER_ID }}
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Bake and load checked full images
        id: ecommerce_bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0, immutable signed Docker release
        with:
          source: .
          files: ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/bake.json
          load: true
          push: false
          progress: plain
      - name: Verify full image handoff
        id: ecommerce_handoff
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        run: node scripts/ci/ecommerce_build.cjs verify-handoff --manifest "$E2E_PREBUILT_MANIFEST"
      - name: Record full cache interaction outcome
        if: always() && steps.ecommerce_prepare.outcome == 'success' && steps.ecommerce_bake.outcome != 'skipped'
        env:
          BAKE_OUTCOME: ${{ steps.ecommerce_bake.outcome }}
          HANDOFF_OUTCOME: ${{ steps.ecommerce_handoff.outcome }}
        run: node scripts/ci/ecommerce_build.cjs cache-outcome --manifest "$E2E_PREBUILT_MANIFEST" --bake-outcome "$BAKE_OUTCOME" --handoff-outcome "$HANDOFF_OUTCOME"
      - name: Warn when full Bake needs cache fallback
        if: steps.ecommerce_bake.outcome == 'failure' && steps.ecommerce_handoff.outcome == 'success'
        run: echo "::warning title=BuildKit cache performance::Bake returned failure after the checked images loaded. Inspect Docker Bake logs; image handoff is valid and full verification will continue."
      - name: Run advisory full E2E proof
        id: ecommerce_verify
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_JOB_STARTED_AT: ${{ steps.e2e_clock.outputs.E2E_JOB_STARTED_AT }}
          E2E_DEADLINE_EPOCH: ${{ steps.e2e_clock.outputs.E2E_DEADLINE_EPOCH }}
          E2E_FINALIZATION_MARGIN_SECONDS: ${{ steps.e2e_clock.outputs.E2E_FINALIZATION_MARGIN_SECONDS }}
          E2E_SOURCE_MODE: hosted
          E2E_EVENT_NAME: ${{ steps.e2e_clock.outputs.E2E_EVENT_NAME }}
          E2E_GIT_REF: ${{ steps.e2e_clock.outputs.E2E_GIT_REF }}
          E2E_EVENT_SHA: ${{ steps.e2e_clock.outputs.E2E_EVENT_SHA }}
          E2E_WORKFLOW_RUN_ID: ${{ steps.e2e_clock.outputs.E2E_WORKFLOW_RUN_ID }}
          E2E_WORKFLOW_RUN_ATTEMPT: ${{ steps.e2e_clock.outputs.E2E_WORKFLOW_RUN_ATTEMPT }}
          E2E_JOB_NAME: ${{ steps.e2e_clock.outputs.E2E_JOB_NAME }}
        run: mix verify.ecommerce_e2e
      - name: Upload advisory E2E evidence
        id: ecommerce_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecommerce-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/scrypath_ecommerce/test-results/docker-full/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/ecommerce-full-${{ github.run_id }}-${{ github.run_attempt }}/image-handoff.json
          if-no-files-found: error
          retention-days: 7
