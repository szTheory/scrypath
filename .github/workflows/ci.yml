name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.3"
            otp: "26.2.5"
          - elixir: "1.19.0"
            otp: "28.1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --exclude integration --include requires_clean_workspace

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release-please-config.json
        run: jq empty release-please-config.json

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Verify workspace is clean
        run: mix verify.workspace_clean

      - name: Run Credo
        run: mix credo

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Build docs
        run: mix docs --warnings-as-errors

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Release contract gate (`mix verify.phase11`)
        run: mix verify.phase11

      - name: Operator checks (`mix verify.phase13 --skip-integration`)
        run: mix verify.phase13 --skip-integration

      - name: Operator Mix + docs gate (`mix verify.phase14`)
        run: mix verify.phase14

      - name: Faceting + guide gate (`mix verify.phase20`)
        run: mix verify.phase20

      - name: Operator polish + drift recovery gate (`mix verify.phase22`)
        run: mix verify.phase22

      - name: Failure rollups gate (`mix verify.phase26`)
        run: mix verify.phase26

      - name: Index contract drift CLI gate (`mix verify.phase28`)
        run: mix verify.phase28

  phase5-verification:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-phase5-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Backfill + integration verification (`mix verify.phase5`)
        run: mix verify.phase5

  phase13-verification:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.0"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-phase13-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Operator integration verification (`mix verify.phase13`)
        run: mix verify.phase13

  meilisearch-smoke:
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    env:
      SCRYPATH_INTEGRATION: "1"
      SCRYPATH_MEILISEARCH_URL: http://127.0.0.1:7700

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.0"
          otp-version: "28.1"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-meilisearch-smoke-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Meilisearch
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail "$SCRYPATH_MEILISEARCH_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch failed to start"
          exit 1

      - name: Run Meilisearch integration smoke
        run: mix verify.meilisearch_smoke
